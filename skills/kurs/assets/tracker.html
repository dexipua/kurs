<title>Мій курс</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Lora:wght@500;700&family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one phone-first column, a bearing-style header, bottom tab bar like an instrument panel */
  :root {
    --bg: #EDF1F2; --surface: #FFFFFF; --ink: #13263A; --muted: #5A6B7B; --line: #D5DEE2;
    --accent: #1D6F80; --accent-ink: #FFFFFF; --brass: #B7841B; --ok: #2F7D4F; --warn: #B4471F; --soft: #E3ECEE;
    --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --body: "Onest", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0F1820; --surface: #16222C; --ink: #E4ECF0; --muted: #93A4B1; --line: #263744;
    --accent: #4DB3C4; --accent-ink: #08151B; --brass: #E0AE48; --ok: #5CC28A; --warn: #F08A62; --soft: #1C2B36; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0F1820; --surface: #16222C; --ink: #E4ECF0; --muted: #93A4B1; --line: #263744;
    --accent: #4DB3C4; --accent-ink: #08151B; --brass: #E0AE48; --ok: #5CC28A; --warn: #F08A62; --soft: #1C2B36; color-scheme: dark }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
  .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 18px; padding-top: 18px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h1 { font: 700 22px/1.15 var(--display); letter-spacing: -0.01em; }
  h2 { font: 600 15px/1.3 var(--display); letter-spacing: 0.01em; }
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .streak { display: flex; align-items: center; gap: 10px; }
  .streak b { font: 700 28px/1 var(--display); color: var(--brass); }
  .streak span { font-size: 13px; color: var(--muted); line-height: 1.2; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  .gauge { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .ring { width: 84px; height: 84px; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bgc { stroke: var(--soft); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring text { fill: var(--ink); font: 700 18px var(--display); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .wd { display: grid; gap: 4px; justify-items: center; font: 500 11px var(--mono); color: var(--muted); }
  .wd i { display: block; width: 100%; height: 34px; border-radius: 6px; background: var(--soft); position: relative; overflow: hidden; }
  .wd i em { position: absolute; inset: auto 0 0 0; background: var(--accent); opacity: .85; }
  .wd.today { color: var(--ink); font-weight: 700; }
  .wd.good i { outline: 2px solid var(--brass); outline-offset: -2px; }

  .list { display: grid; gap: 2px; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); min-width: 0; }
  .row:first-child { border-top: 0; }
  .row .t { min-width: 0; overflow-wrap: anywhere; }
  .row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.done .t > div:first-child { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .check { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
  .check.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .check svg { width: 16px; height: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .chip { font: 500 12px/1 var(--mono); padding: 4px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .chip.bad { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .chip.hot { background: color-mix(in srgb, var(--brass) 18%, transparent); color: var(--brass); }
  .icon-btn { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 8px; font-size: 14px; }
  .icon-btn:hover { color: var(--ink); background: var(--soft); }

  .btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ghost { border-color: var(--line); }
  .btn.danger { border-color: var(--warn); color: var(--warn); }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  form.inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; width: 100%; min-width: 0; color: var(--ink); }
  textarea { resize: vertical; min-height: 70px; }

  .coach { border-left: 3px solid var(--brass); padding: 4px 0 4px 12px; white-space: pre-wrap; }
  .coach small { display: block; color: var(--muted); font: 500 12px var(--mono); margin-bottom: 4px; }
  .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .steps { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .steps li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
  .steps .check { width: 22px; height: 22px; border-radius: 6px; }
  .steps li.done span { color: var(--muted); text-decoration: line-through; }
  .notice { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .exam { background: color-mix(in srgb, var(--brass) 14%, var(--surface)); border-color: var(--brass); }
  details > summary { cursor: pointer; color: var(--muted); font-size: 14px; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav.tabs div { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
  nav.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; font-size: 11.5px; padding: 6px 2px; border-radius: 10px; }
  nav.tabs a svg { width: 22px; height: 22px; }
  nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--soft); font-weight: 600; }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 18px; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(8 16 22 / .45); }
  dialog form { display: grid; gap: 12px; }
  .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 9; display: grid; gap: 6px; justify-items: center; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
  .toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px -10px rgb(0 0 0 / .4); }
  /* Game layer: a status window with rank, level, XP and stats */
  .status { border: 1.5px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
  .st-head { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .rank { width: 58px; height: 58px; border-radius: 12px; display: grid; place-items: center; font: 700 28px var(--display);
    color: var(--accent-ink); background: var(--accent); }
  .rank.S, .rank.A { background: var(--brass); }
  .lvl { font: 700 18px var(--display); }
  .xpbar { height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .xpbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--brass)); border-radius: 99px; transition: width .5s ease; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
  .stat b { font: 700 18px var(--display); }
  .stat span { font: 500 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quest-done { color: var(--ok); font: 600 13px var(--mono); }
  .penalty { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
  .ach { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ach div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
  .ach div b { font-size: 14px; }
  .ach div small { color: var(--muted); font-size: 12px; }
  .ach div.locked { opacity: .45; }
  .ach div.got { border-color: var(--brass); }
  .levelup { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgb(8 16 22 / .55); padding: 24px; }
  .levelup div { background: var(--surface); border: 2px solid var(--brass); border-radius: 16px; padding: 22px 26px; text-align: center; display: grid; gap: 6px; max-width: 320px; }
  .levelup b { font: 700 13px var(--mono); letter-spacing: .14em; color: var(--brass); }
  .levelup strong { font: 700 34px var(--display); }
  /* Skins: each one redefines the grounds, accent and second colour for light and dark */
  :root[data-skin="forest"] { --bg: #EEF2EC; --soft: #E1EADD; --line: #D3DDCF; --accent: #2E6B3F; --brass: #A8741C }
  @media (prefers-color-scheme: dark) { :root[data-skin="forest"]:not([data-theme="light"]) { --bg: #101712; --surface: #18221A; --soft: #1F2C22; --line: #2A3B2D; --accent: #6CC48A; --accent-ink: #0B160E; --brass: #DDAE52 } }
  :root[data-skin="forest"][data-theme="dark"] { --bg: #101712; --surface: #18221A; --soft: #1F2C22; --line: #2A3B2D; --accent: #6CC48A; --accent-ink: #0B160E; --brass: #DDAE52 }
  :root[data-skin="sunset"] { --bg: #F7EFE9; --soft: #F0E2D8; --line: #E6D4C8; --accent: #B4532A; --brass: #8A5BB0 }
  @media (prefers-color-scheme: dark) { :root[data-skin="sunset"]:not([data-theme="light"]) { --bg: #1A1214; --surface: #241A1C; --soft: #2F2125; --line: #3D2B2F; --accent: #F0895E; --accent-ink: #1A0E08; --brass: #C59CE8 } }
  :root[data-skin="sunset"][data-theme="dark"] { --bg: #1A1214; --surface: #241A1C; --soft: #2F2125; --line: #3D2B2F; --accent: #F0895E; --accent-ink: #1A0E08; --brass: #C59CE8 }
  :root[data-skin="violet"] { --bg: #EFEEF8; --soft: #E4E1F4; --line: #D6D2EC; --accent: #5843C8; --brass: #B8740A }
  @media (prefers-color-scheme: dark) { :root[data-skin="violet"]:not([data-theme="light"]) { --bg: #0D0B19; --surface: #16132A; --soft: #1F1B38; --line: #2C2749; --accent: #8F7BFF; --accent-ink: #0D0A1F; --brass: #F2B544 } }
  :root[data-skin="violet"][data-theme="dark"] { --bg: #0D0B19; --surface: #16132A; --soft: #1F1B38; --line: #2C2749; --accent: #8F7BFF; --accent-ink: #0D0A1F; --brass: #F2B544 }
  :root[data-skin="sakura"] { --bg: #FBF1F4; --soft: #F4E0E8; --line: #EAD2DC; --accent: #B83F72; --brass: #2F8574 }
  @media (prefers-color-scheme: dark) { :root[data-skin="sakura"]:not([data-theme="light"]) { --bg: #1A1116; --surface: #24171E; --soft: #2F1E27; --line: #3E2934; --accent: #F08DB6; --accent-ink: #200A14; --brass: #6CC9B5 } }
  :root[data-skin="sakura"][data-theme="dark"] { --bg: #1A1116; --surface: #24171E; --soft: #2F1E27; --line: #3E2934; --accent: #F08DB6; --accent-ink: #200A14; --brass: #6CC9B5 }
  :root[data-skin="mono"] { --bg: #F1F1F0; --soft: #E5E5E3; --line: #D5D5D2; --accent: #232323; --accent-ink: #FFFFFF; --brass: #8C6A16 }
  @media (prefers-color-scheme: dark) { :root[data-skin="mono"]:not([data-theme="light"]) { --bg: #111111; --surface: #1A1A1A; --soft: #242424; --line: #333333; --accent: #EDEDED; --accent-ink: #111111; --brass: #D8B45E } }
  :root[data-skin="mono"][data-theme="dark"] { --bg: #111111; --surface: #1A1A1A; --soft: #242424; --line: #333333; --accent: #EDEDED; --accent-ink: #111111; --brass: #D8B45E }
  .skins { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .skin { display: grid; gap: 6px; justify-items: start; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); text-align: left; }
  .skin[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
  .skin i { display: flex; gap: 4px; } .skin i b { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .timer { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .timer.run { color: var(--accent); }
  @media (max-width: 420px) { .skins { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  :root[data-skin="neon"] { --bg: #F1EFF8; --soft: #E6E2F3; --line: #D7D2EA; --accent: #C2187A; --brass: #0E8A9A }
  @media (prefers-color-scheme: dark) { :root[data-skin="neon"]:not([data-theme="light"]) { --bg: #0B0A12; --surface: #13111E; --soft: #1C1930; --line: #2A2545; --accent: #FF3EA5; --accent-ink: #14020C; --brass: #22E4F0 } }
  :root[data-skin="neon"][data-theme="dark"] { --bg: #0B0A12; --surface: #13111E; --soft: #1C1930; --line: #2A2545; --accent: #FF3EA5; --accent-ink: #14020C; --brass: #22E4F0 }
  :root[data-skin="sand"] { --bg: #F5EFE4; --soft: #ECE2D2; --line: #E0D3BF; --accent: #8A5A2B; --brass: #3E7A6B }
  @media (prefers-color-scheme: dark) { :root[data-skin="sand"]:not([data-theme="light"]) { --bg: #17130E; --surface: #211B14; --soft: #2B241B; --line: #3A3125; --accent: #E0A66A; --accent-ink: #1A0F04; --brass: #7BC2AE } }
  :root[data-skin="sand"][data-theme="dark"] { --bg: #17130E; --surface: #211B14; --soft: #2B241B; --line: #3A3125; --accent: #E0A66A; --accent-ink: #1A0F04; --brass: #7BC2AE }
  :root[data-skin="lavender"] { --bg: #F3F0FA; --soft: #E9E3F6; --line: #DCD4EE; --accent: #7550C2; --brass: #C2627E }
  @media (prefers-color-scheme: dark) { :root[data-skin="lavender"]:not([data-theme="light"]) { --bg: #121019; --surface: #1B1824; --soft: #252131; --line: #332D42; --accent: #B79BF5; --accent-ink: #130A24; --brass: #F096B0 } }
  :root[data-skin="lavender"][data-theme="dark"] { --bg: #121019; --surface: #1B1824; --soft: #252131; --line: #332D42; --accent: #B79BF5; --accent-ink: #130A24; --brass: #F096B0 }
  :root[data-skin="coffee"] { --bg: #F3EEE9; --soft: #E8DFD7; --line: #DCD0C5; --accent: #6B4430; --brass: #B5873A }
  @media (prefers-color-scheme: dark) { :root[data-skin="coffee"]:not([data-theme="light"]) { --bg: #14100D; --surface: #1E1814; --soft: #28201B; --line: #382D26; --accent: #D29A72; --accent-ink: #170C05; --brass: #E5BE6E } }
  :root[data-skin="coffee"][data-theme="dark"] { --bg: #14100D; --surface: #1E1814; --soft: #28201B; --line: #382D26; --accent: #D29A72; --accent-ink: #170C05; --brass: #E5BE6E }
  :root[data-skin="aurora"] { --bg: #ECF3F2; --soft: #DEEBE9; --line: #CFDFDC; --accent: #0F7A6C; --brass: #7C4DC4 }
  @media (prefers-color-scheme: dark) { :root[data-skin="aurora"]:not([data-theme="light"]) { --bg: #071214; --surface: #0E1C1F; --soft: #14272B; --line: #1F383D; --accent: #3EE0B8; --accent-ink: #02130E; --brass: #B08CFF } }
  :root[data-skin="aurora"][data-theme="dark"] { --bg: #071214; --surface: #0E1C1F; --soft: #14272B; --line: #1F383D; --accent: #3EE0B8; --accent-ink: #02130E; --brass: #B08CFF }
  :root[data-skin="ruby"] { --bg: #F7EEEE; --soft: #EFE0E0; --line: #E4D0D0; --accent: #A3243B; --brass: #B07A1E }
  @media (prefers-color-scheme: dark) { :root[data-skin="ruby"]:not([data-theme="light"]) { --bg: #140A0C; --surface: #1E1114; --soft: #2A171B; --line: #3B2227; --accent: #F06A82; --accent-ink: #1A0207; --brass: #E8B657 } }
  :root[data-skin="ruby"][data-theme="dark"] { --bg: #140A0C; --surface: #1E1114; --soft: #2A171B; --line: #3B2227; --accent: #F06A82; --accent-ink: #1A0207; --brass: #E8B657 }
  /* Shape, density and type options */
  :root { --r: 14px; }
  .panel, dialog { border-radius: var(--r); }
  .btn, .stat, .skin, input[type=text], input[type=date], input[type=number], select, textarea { border-radius: calc(var(--r) * .7); }
  :root[data-radius="sharp"] { --r: 4px; }
  :root[data-radius="round"] { --r: 24px; }
  :root[data-density="compact"] .panel { padding: 11px 12px; gap: 8px; }
  :root[data-density="compact"] #view { gap: 12px; }
  :root[data-density="compact"] #view.cols > * { margin-bottom: 12px; }
  :root[data-density="compact"] .row { padding: 6px 2px; }
  :root[data-density="compact"] body { font-size: 15px; }
  :root[data-font="classic"] { --display: "Lora", Georgia, serif; --body: "Lora", Georgia, serif; }
  :root[data-font="rounded"] { --display: "Comfortaa", "Segoe UI", sans-serif; }
  :root[data-font="mono"] { --display: "JetBrains Mono", ui-monospace, monospace; --body: "JetBrains Mono", ui-monospace, monospace; }
  .looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 420px) { .looks { grid-template-columns: 1fr; } }
  /* Calendar: a month grid tinted by how much of the daily quest was done */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .cal-head h2 { text-transform: capitalize; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .wdn { font: 500 11px var(--mono); color: var(--muted); text-align: center; padding-bottom: 2px; }
  .day { position: relative; aspect-ratio: 1 / 1; min-height: 40px; border-radius: calc(var(--r) * .6); border: 1px solid var(--line); padding: 5px;
    background: color-mix(in srgb, var(--accent) calc(var(--p, 0) * 1%), var(--bg)); display: grid; align-content: space-between; text-align: left; cursor: pointer; color: var(--ink); min-width: 0; }
  .day.out { opacity: .38; }
  .day.today { border: 2px solid var(--accent); }
  .day.good::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); }

<script>
const DEFAULT_AREAS = [
  { id: "career", name: "Кар'єра", color: "#3A6EA5" }, { id: "study", name: "Навчання", color: "#7A5CC4" },
  { id: "books", name: "Книги", color: "#B7841B" }, { id: "body", name: "Тіло", color: "#2F7D4F" },
  { id: "mind", name: "Розум", color: "#1D6F80" }, { id: "life", name: "Життя", color: "#B4471F" },
];
const SKINS = [["sea", "Море", "#1D6F80", "#B7841B"], ["forest", "Ліс", "#2E6B3F", "#A8741C"], ["sunset", "Захід сонця", "#B4532A", "#8A5BB0"], ["violet", "Система", "#5843C8", "#B8740A"], ["sakura", "Сакура", "#B83F72", "#2F8574"], ["mono", "Графіт", "#232323", "#8C6A16"], ["neon", "Неон", "#C2187A", "#0E8A9A"], ["sand", "Пісок", "#8A5A2B", "#3E7A6B"], ["lavender", "Лаванда", "#7550C2", "#C2627E"], ["coffee", "Кава", "#6B4430", "#B5873A"], ["aurora", "Північне сяйво", "#0F7A6C", "#7C4DC4"], ["ruby", "Рубін", "#A3243B", "#B07A1E"]];
const DEFAULT_SETTINGS = { name: "", about: "", skin: "sea", mode: "system", radius: "soft", density: "cozy", font: "modern", tone: "balanced", examMode: false, threshold: 60, areas: DEFAULT_AREAS,
  reminders: "08:00 план на день · 21:00 вечірня перевірка · неділя 19:00 розбір тижня" };
const S = { habits: [], tasks: [], goals: [], notes: [], days: {}, journal: {}, roadmap: [], books: [], settings: null, loaded: new Set(), readOnly: false };
let db = null, sample = null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const DAY_START_HOUR = 4;
const NOW = () => new Date(Date.now() - DAY_START_HOUR * 3600000);
const TODAY = () => ymd(NOW());
const weekStart = d => addDays(d, -((d.getDay() + 6) % 7));
const set = () => ({ ...DEFAULT_SETTINGS, ...(S.settings || {}) });
const areas = () => (set().areas && set().areas.length ? set().areas : DEFAULT_AREAS);
const area = id => areas().find(a => a.id === id) || { id, name: id || "—", color: "#888" };
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("uk-UA", { day: "numeric", month: "short" }); };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/></svg>';

function toast(msg) {
  let box = document.querySelector(".toasts");
  if (!box) { box = document.createElement("div"); box.className = "toasts"; box.setAttribute("role", "status"); document.body.append(box); }
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; box.append(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 2600);
}

// One write at a time per document.
const queues = {};
function write(path, fn) {
  if (S.readOnly) { toast("Ця сторінка зараз лише для перегляду"); return Promise.resolve(); }
  queues[path] = (queues[path] || Promise.resolve()).then(fn).catch(e => {
    if (e && e.code === "invalid_argument") { S.readOnly = true; toast("Зберегти не вдалося: немає права на запис"); }
    else if (e && e.code === "quota_exceeded") toast("Сховище заповнене: видали старі задачі");
    else toast("Не зберіглося. Перевір з'єднання й спробуй ще раз");
  });
  return queues[path];
}

// ---------- derived numbers ----------
const activeHabits = () => S.habits.filter(h => h.active !== false && (!set().examMode || h.keepInExams || h.area === "study"))
  .sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
const dailyHabits = () => activeHabits().filter(h => h.freq !== "weekly");
const weeklyHabits = () => activeHabits().filter(h => h.freq === "weekly");
const doneOn = (date, id) => !!(S.days[date] && S.days[date].done && S.days[date].done[id]);
function dayRate(date) {
  const hs = dailyHabits(); if (!hs.length) return 0;
  return hs.filter(h => doneOn(date, h.id)).length / hs.length;
}
const isGood = date => dailyHabits().length > 0 && dayRate(date) * 100 >= set().threshold;
function streak() {
  let n = 0, d = NOW();
  if (!isGood(ymd(d))) d = addDays(d, -1); // today still counts as open
  for (let i = 0; i < 400 && isGood(ymd(d)); i++) { n++; d = addDays(d, -1); }
  return n;
}
function weekCount(id) {
  const ws = weekStart(NOW()); let c = 0;
  for (let i = 0; i < 7; i++) if (doneOn(ymd(addDays(ws, i)), id)) c++;
  return c;
}
function missedDaysInRow() {
  let n = 0, d = addDays(NOW(), -1);
  for (let i = 0; i < 14 && dailyHabits().length && dayRate(ymd(d)) === 0; i++) { n++; d = addDays(d, -1); }
  return n;
}
// Daily bonuses («⚡ Челендж дня», «🎲 Фан дня») expire with their day instead of piling up as overdue.
const isBonus = t => /^(⚡|🎲)/.test(t.title || "");
const openTasks = () => S.tasks.filter(t => !t.done && !(isBonus(t) && t.due && t.due < TODAY()));

function habitStreak(h) {
  if (h.freq === "weekly") { let n = 0, ws = weekStart(NOW());
    for (let w = 1; w < 60; w++) { const s0 = addDays(ws, -7 * w); let c = 0; for (let i = 0; i < 7; i++) if (doneOn(ymd(addDays(s0, i)), h.id)) c++; if (c >= (h.target || 1)) n++; else break; }
    return { n, unit: "тиж." }; }
  let n = 0, d = NOW(); if (!doneOn(ymd(d), h.id)) d = addDays(d, -1);
  for (let i = 0; i < 400 && doneOn(ymd(d), h.id); i++) { n++; d = addDays(d, -1); }
  return { n, unit: "дн." };
}
function viewHabits() {

function focusBeep() {
  try { const a = focus.audio; if (!a) return; [0, .35, .7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); }); } catch {}
}
function focusStart(min) {

  try { focus.audio = focus.audio || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  focus.minutes = min; focus.endAt = Date.now() + min * 60000;
  clearInterval(focus.tick);
  focus.tick = setInterval(() => { const el = $("#focusClock"); if (el) el.textContent = fmtLeft(focus.endAt - Date.now()); if (Date.now() >= focus.endAt) focusStop(true); }, 1000);
  render();

function focusStop(finished) {

  const done = finished ? focus.minutes : Math.floor((focus.minutes * 60000 - Math.max(0, focus.endAt - Date.now())) / 60000);
  focus.endAt = 0;
  if (done > 0) {
    const date = TODAY(), day = S.days[date] || { date, done: {} }, total = (day.focus || 0) + done;

  if (finished) { focusBeep(); confetti(24); }
  render();

  return `<section class="panel"><div class="panel-head"><h2>Медитація</h2>${done ? `<span class="quest-done">ЗРОБЛЕНО</span>` : `<span class="eyebrow">${h ? "звичка · " : ""}дихання</span>`}</div>
    <div class="moods" role="group" aria-label="Техніка">${Object.entries(MED_MODES).map(([k, x]) => `<button type="button" class="chip-btn" data-act="medMode" data-m="${k}" aria-pressed="${med.mode === k}">${x.name}</button>`).join("")}</div>
    <p class="muted" style="margin:0">${m.hint}</p>
    <div class="actions"><button class="btn primary" type="button" data-act="med" data-min="5">5 хв</button><button class="btn ghost" type="button" data-act="med" data-min="3">3 хв</button><button class="btn ghost" type="button" data-act="med" data-min="10">10 хв</button></div></section>`;
}
function medBell() {
  try { const a = med.audio; if (!a) return; [[396, .18], [792, .05]].forEach(([f, v]) => { const o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + 3); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 3); }); } catch {}
}
function medStart(min) {
  if (!min || med.el) return;
  try { med.audio = med.audio || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  try { navigator.wakeLock?.request("screen").then(l => { med.lock = l; }, () => {}); } catch {}
  med.startAt = Date.now(); med.endAt = med.startAt + min * 60000; med.phase = "";
  const o = document.createElement("div");
  o.className = "med"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", "Медитація");
  o.innerHTML = `<div class="med-orb ${MED_MODES[med.mode].steps.length ? "" : "free"}" id="medOrb" aria-hidden="true"></div>
    <p class="med-phase" id="medPhase" aria-live="polite"></p><p class="med-left num" id="medLeft"></p>
    <button class="btn" type="button" data-act="medStop">Завершити</button>`;
  document.body.append(o); med.el = o; o.querySelector("button").focus();
  medBell(); clearInterval(med.tick); med.tick = setInterval(medTick, 200); medTick();
}
function medTick() {
  const now = Date.now();
  if (now >= med.endAt) return medStop(true);
  $("#medLeft").textContent = fmtLeft(med.endAt - now);
  const steps = MED_MODES[med.mode].steps;
  if (!steps.length) { if (!med.phase) $("#medPhase").textContent = med.phase = "Просто дихай"; return; }
  const cycle = steps.reduce((a, x) => a + x[1], 0);
  let t = ((now - med.startAt) / 1000) % cycle, i = 0;
  while (t >= steps[i][1]) t -= steps[i++][1];
  const [name, sec] = steps[i], key = name + i;
  if (key === med.phase) return;
  med.phase = key; $("#medPhase").textContent = name;
  const orb = $("#medOrb"); orb.style.transitionDuration = sec + "s";
  if (name === "Вдих") orb.style.transform = "scale(1)"; else if (name === "Видих") orb.style.transform = "scale(.55)";
}
function medStop(finished) {
  if (!med.el) return;
  clearInterval(med.tick); med.tick = null;
  const spent = Date.now() - med.startAt;
  med.el.remove(); med.el = null; med.endAt = 0;
  try { med.lock?.release(); } catch {} med.lock = null;
  if (finished) medBell();
  const h = medHabit();
  // a session counts when finished, or when stopped after at least 3 minutes
  if ((finished || spent >= 180000) && h && !doneOn(TODAY(), h.id)) toggleHabit(h.id);
  else { if (finished) toast("Медитацію завершено"); render(); }
}

// ---------- English speaking practice: a short role-play with Claude, by voice or text ----------
const ENG_TOPICS = {
  interview: "an internship or junior job interview: ask about the candidate's own projects, teamwork, a hard problem they solved and their motivation",
  tech: "a friendly technical chat about the student's field (for a developer: their main language, frameworks, SQL and REST), one simple question at a time",
  small: "relaxed small talk about university life, books, chess and plans for the summer",
};
const eng = { turns: [], feedback: "", topic: "interview", dict: null, tts: null, listening: false, voice: true, busy: false, ctl: null };
const englishHabit = () => S.habits.find(h => h.active !== false && /англ|english/i.test(h.title || ""));
function englishPanel() {
  const h = englishHabit();
  return `<section class="panel"><div class="panel-head"><h2>Англійська з Claude</h2>${h && doneOn(TODAY(), h.id) ? `<span class="quest-done">СЬОГОДНІ Є</span>` : `<span class="eyebrow">10 хв</span>`}</div>
    <p class="muted" style="margin:0">Коротка розмова англійською, як на співбесіді. Claude відповідає, виправляє помилки й наприкінці дає фідбек. Можна говорити голосом або писати.</p>
    <div class="actions"><button class="btn primary" type="button" data-act="eng">Почати розмову</button></div></section>`;
}
function engRender() {
  const log = $("#engLog");
  log.innerHTML = eng.turns.slice(1).map(t => `<div class="msg ${t.role === "user" ? "me" : "ai"}">${esc(t.content)}</div>`).join("")
    + (eng.feedback ? `<div class="msg ai fb">${esc(eng.feedback)}</div>` : "")
    || `<p class="muted">Обери тему й натисни «Почати заново» або просто напиши першу фразу англійською.</p>`;
  log.scrollTop = log.scrollHeight;
  $("#engMic").hidden = !eng.dict; $("#engMic").textContent = eng.listening ? "Стоп" : "Говорити";
  $("#engMic").classList.toggle("primary", eng.listening);
  $("#engVoice").hidden = !eng.tts; $("#engVoice").textContent = eng.voice ? "Голос: увімк." : "Голос: вимк.";
  $("#engSend").disabled = $("#engFinish").disabled = eng.busy;
  $("#engFinish").hidden = eng.turns.length < 4;
}
function engSystem() {
  return `You are a friendly English speaking partner for a Ukrainian student (about B1 level) who is preparing for IT internship interviews. Scenario: ${ENG_TOPICS[eng.topic]}. What you know about the student: ${[set().name, set().about].filter(Boolean).join(", ") || "a university student"}.
Rules: write plain text only. Ask exactly one question per reply, at most 3 short sentences, in simple natural English. If the student's last message has a real mistake, start your reply with one line in Ukrainian beginning with "Виправлення:" showing the better phrase, then continue in English. Never lecture.`;
}
async function engAsk() {
  if (!sample || eng.busy) return;
  eng.busy = true; eng.ctl = new AbortController(); engRender();
  const log = $("#engLog"), bubble = document.createElement("div");
  bubble.className = "msg ai"; bubble.textContent = "…"; log.append(bubble); log.scrollTop = log.scrollHeight;
  try {
    const { text } = await sample(eng.turns, { cache: false, modelTier: "quick", signal: eng.ctl.signal,
      onText: ({ text: t }) => { bubble.textContent = t; log.scrollTop = log.scrollHeight; } });
    eng.turns.push({ role: "assistant", content: text });
    if (eng.tts && eng.voice) {
      const english = text.split("\n").filter(l => !/^Виправлення:/i.test(l.trim())).join(" ").trim();
      if (english) eng.tts.speak(english, { language: "en" }).catch(() => {});
    }
  } catch (e) {
    if (e.code !== "cancelled") bubble.textContent = e.code === "rate_limited" ? "Забагато запитів. Спробуй за хвилину." : "Не вдалося отримати відповідь. Спробуй ще раз.";
  }
  eng.busy = false; engRender();
}
function engStart() {
  eng.feedback = "";
  eng.turns = [{ role: "user", content: engSystem() + "\nStart the conversation now with a short greeting and your first question." }];
  engAsk();
}
function engSend() {
  const box = $("#engText"), text = box.value.trim();
  if (!text || eng.busy) return;
  if (!eng.turns.length) eng.turns = [{ role: "user", content: engSystem() + " The student opens the conversation." }];
  box.value = "";
  eng.turns.push({ role: "user", content: text });
  engAsk();
}
async function engFinish() {
  if (!sample || eng.busy || eng.turns.length < 4) return;
  eng.busy = true; engRender();
  const dialogText = eng.turns.slice(1).map(t => (t.role === "user" ? "Student: " : "Partner: ") + t.content).join("\n");
  const out = $("#engLog"), fb = document.createElement("div");
  fb.className = "msg ai fb"; fb.textContent = "Готую фідбек…"; out.append(fb); out.scrollTop = out.scrollHeight;
  eng.feedback = "Готую фідбек…";
  try {
    const { text } = await sample(`Ось розмова студента англійською з тренером. Дай фідбек українською, коротко і по ділу:
1) 3 головні помилки студента з правильним варіантом;
2) 3 вдалі фрази або сильні сторони;
3) один конкретний фокус на наступну розмову;
4) орієнтовний рівень (A2/B1/B2/C1) одним рядком.
Без вступу.

${dialogText}`, { cache: false, onText: ({ text: t }) => { eng.feedback = t; fb.textContent = t; out.scrollTop = out.scrollHeight; } });
    eng.feedback = text;
    write("notes/new", () => db.collection("notes").add({ at: new Date().toISOString(), kind: "page", text: "Англійська з Claude — фідбек:\n" + text }));
    const h = englishHabit();
    if (h && !doneOn(TODAY(), h.id)) toggleHabit(h.id);
  } catch (e) { eng.feedback = "Не вдалося отримати фідбек. Спробуй ще раз."; }
  eng.busy = false; engRender();
}
function engMic() {
  if (!eng.dict) return;
  if (eng.listening) { eng.dict.stop().catch(() => {}); return; }
  eng.dict.start({ language: "en" }).catch(e => {
    if (e && (e.code === "not_granted" || e.code === "unavailable")) { eng.dict = null; engRender(); toast("Голосове введення недоступне, пиши текстом"); }
  });
}
function openEnglish() {
  eng.turns = []; eng.feedback = ""; engRender();
  $("#engTopic").value = eng.topic;
  $("#eng").showModal();
}
async function engInit() {
  const c = window.claude; if (!c) return;
  const [d, t] = await Promise.all([c.use("dictation").catch(() => null), c.use("tts").catch(() => null)]);
  eng.dict = d; eng.tts = t;
  if (d) {
    let partialBase = "";
    d.onState(({ state }) => { eng.listening = state === "listening" || state === "starting"; if (state === "listening") partialBase = $("#engText").value; engRender(); });
    d.onPartial(({ text }) => { $("#engText").value = (partialBase ? partialBase + " " : "") + text; });
    d.onFinal(({ text }) => { partialBase = ((partialBase ? partialBase + " " : "") + text).trim(); $("#engText").value = partialBase; });
  }
}

// ---------- events ----------
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "habit") toggleHabit(id, b.dataset.date || TODAY());
  if (act === "calDay") { cal.sel = b.dataset.date; render(); }
  if (act === "calNav") { const n = Number(b.dataset.d); cal.month = n ? new Date(cal.month.getFullYear(), cal.month.getMonth() + n, 1) : new Date(NOW().getFullYear(), NOW().getMonth(), 1); if (!n) cal.sel = TODAY(); render(); }
  if (act === "newTaskOn") taskDialog(null, b.dataset.date);
  if (act === "jMood") { const dt = b.dataset.date; jDraft[dt] = { ...jDraft[dt], mood: Number(b.dataset.m) }; render(); }
  if (act === "jSave") saveJournal(b.dataset.date);
  if (act === "medMode") { med.mode = b.dataset.m; render(); }
  if (act === "med") medStart(Number(b.dataset.min));
  if (act === "medStop") medStop(false);
  if (act === "tfilter") { taskFilter = b.dataset.area || ""; render(); }
  if (act === "task") { const t = S.tasks.find(x => x.id === id); if (t) toggleTask(t); }
  if (act === "editTask") taskDialog(S.tasks.find(x => x.id === id));
  if (act === "newTask") taskDialog(null);
  if (act === "newHabit") habitDialog(null);
  if (act === "editHabit") habitDialog(S.habits.find(x => x.id === id));
  if (act === "newGoal") goalDialog(null);
  if (act === "editGoal") goalDialog(S.goals.find(x => x.id === id));
  if (act === "rmStep") { const x = S.roadmap.find(r => r.id === id); if (x) toggleRm(x, Number(b.dataset.i)); }
  if (act === "step") { const g = S.goals.find(x => x.id === id); if (g) toggleStep(g, Number(b.dataset.i)); }
  if (act === "newBook") bookDialog(null);
  if (act === "editBook") bookDialog(S.books.find(x => x.id === id));
  if (act === "bookRate") { const bk = S.books.find(x => x.id === id), n = Number(b.dataset.n); if (bk) setBook(bk, { rating: bk.rating === n ? null : n }); }
  if (act === "bookStatus") { const bk = S.books.find(x => x.id === id), st = b.dataset.s; if (bk) { setBook(bk, st === "read" ? { status: st, finishedAt: new Date().toISOString() } : { status: st }); if (st === "read") { toast(`Книгу дочитано! +${XP.book} маси`); confetti(30); } } }
  if (act === "libFilter") { libFilter = b.dataset.t || ""; render(); }
  if (act === "mainQuest") saveSettings({ mainQuest: set().mainQuest === id ? null : id });
  if (act === "exam") saveSettings({ examMode: !set().examMode });
  if (act === "addArea") saveSettings({ areas: [...areas(), { id: "a" + Date.now().toString(36), name: "Новий напрям", color: "#6B7C8C" }] });
  if (act === "delArea") { const l = [...areas()]; l.splice(Number(b.dataset.i), 1); saveSettings({ areas: l }); }
  if (act === "advice") coach("");
  if (act === "eng") openEnglish();
  if (act === "skin") saveSettings({ skin: b.dataset.skin });
  if (act === "focus") focusStart(Number(b.dataset.min));
  if (act === "focusStop") focusStop(false);
  if (act === "engStart") { eng.ctl?.abort(); eng.busy = false; engStart(); }
  if (act === "engSend") engSend();
  if (act === "engFinish") engFinish();
  if (act === "engMic") engMic();
  if (act === "engVoice") { eng.voice = !eng.voice; if (!eng.voice) eng.tts?.stop(); engRender(); }
  if (act === "engClose") { eng.ctl?.abort(); eng.busy = false; eng.tts?.stop(); if (eng.listening) eng.dict?.stop().catch(() => {}); $("#eng").close(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "engTopic") eng.topic = el.value;
  if (el.id === "lookMode") saveSettings({ mode: el.value });
  if (el.id === "lookRadius") saveSettings({ radius: el.value });
  if (el.id === "lookDensity") saveSettings({ density: el.value });
  if (el.id === "lookFont") saveSettings({ font: el.value });
  if (el.id === "tone") saveSettings({ tone: el.value });
  if (el.id === "pName") saveSettings({ name: el.value.trim() });
  if (el.id === "pAbout") saveSettings({ about: el.value.trim() });
  if (el.id === "pVision") saveSettings({ vision: el.value.trim() });
  if (el.id === "threshold") saveSettings({ threshold: Number(el.value) });
  if (el.dataset.areaName !== undefined || el.dataset.areaColor !== undefined) {
    const l = areas().map(a => ({ ...a })), i = Number(el.dataset.areaName ?? el.dataset.areaColor);
    if (el.dataset.areaName !== undefined) l[i].name = el.value.trim() || l[i].name; else l[i].color = el.value;
    saveSettings({ areas: l });
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "askBox") { e.preventDefault(); const t = $("#cmdText").value.trim(); if (t) runCommand(t); return; }
  if (e.target.id !== "quickTask") return;
  e.preventDefault();
  const title = $("#qtTitle").value.trim(); if (!title) return;
  $("#qtTitle").value = "";
  const ref = db.collection("tasks").doc();
  write("tasks/" + ref.id, () => ref.set({ title, area: "study", due: null, priority: "normal", notes: "", done: false, createdAt: new Date().toISOString() }));
  toast("Задачу додано");
});
document.addEventListener("input", e => { if (e.target.id === "jText") { const dt = e.target.dataset.date; jDraft[dt] = { ...jDraft[dt], text: e.target.value }; } });
document.addEventListener("toggle", e => { const id = e.target.dataset && e.target.dataset.rm; if (id) { if (e.target.open) rmOpen.add(id); else rmOpen.delete(id); } }, true);
addEventListener("hashchange", render);
// Shortcuts: 1-6 switch tabs, N adds a task, F starts 25 min of focus (never while typing or in a dialog).
document.addEventListener("keydown", e => {
  if (med.el) { if (e.key === "Escape") { medStop(false); e.preventDefault(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest("input, textarea, select, dialog")) return;
  const tabs = ["today", "tasks", "habits", "goals", "library", "cal", "setup"], i = "1234567".indexOf(e.key);
  if (i >= 0) { location.hash = "#" + tabs[i]; e.preventDefault(); }
  else if (e.key === "n" || e.key === "т") { taskDialog(null); e.preventDefault(); }
  else if ((e.key === "f" || e.key === "а") && !(focus.endAt > Date.now())) { focusStart(25); e.preventDefault(); }
});
document.addEventListener("keydown", e => { if (e.target.id === "engText" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); engSend(); } });
document.addEventListener("keydown", e => { if (e.target.id === "cmdText" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#askBox").requestSubmit(); } });

// ---------- boot ----------
render();
(async () => {
  const c = window.claude;
  db = c ? await c.use("db") : null;
  if (!db) { $("#status").textContent = "Відкрий цю сторінку на claude.ai у своєму акаунті, щоб побачити й зберігати свій курс."; return; }
  c.use("sample").then(s => { sample = s; render(); });
  engInit();
  const timer = setTimeout(() => { $("#status").hidden = false; $("#status").textContent = "Дані поки не доходять. Можливо, немає з'єднання; сторінка оновиться сама."; }, 10000);
  const need = ["habits", "tasks", "goals", "notes", "days", "settings"];
  const got = (k, snap) => {
    if (!snap.metadata.fromCache) S.loaded.add(k);
    if (need.every(n => S.loaded.has(n))) { clearTimeout(timer); $("#status").hidden = true; }
    render();
  };
  const fail = e => { clearTimeout(timer); $("#status").hidden = false; $("#status").textContent = e.code === "revoked" ? "Доступ до цієї сторінки змінився." : "Частину даних не вдалося завантажити. Онови сторінку пізніше."; };
  const list = k => snap => { S[k] = snap.docs.map(d => ({ id: d.id, ...d.data() })); got(k, snap); };
  db.collection("habits").onSnapshot(list("habits"), fail);
  db.collection("tasks").onSnapshot(list("tasks"), fail);
  db.collection("goals").onSnapshot(list("goals"), fail);
  db.collection("roadmap").onSnapshot(list("roadmap"), fail);
  db.collection("books").onSnapshot(list("books"), fail);
  db.collection("notes").orderBy("at", "desc").limit(10).onSnapshot(list("notes"), fail);
  // All days: total XP needs the whole history (about 365 small documents a year).
  db.collection("days").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.days = m; got("days", snap);
  }, fail);
  db.collection("journal").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.journal = m; render(); }, fail);
  db.doc("settings/main").onSnapshot(snap => { S.settings = snap.exists ? snap.data() : null; got("settings", snap); }, fail);
})();
</script>
